version: '3.8'

services:
  hafalanku-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hafalanku}
      POSTGRES_USER: ${POSTGRES_USER:-hafalanku_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-P@ssw0rdHafalanKu2026!}
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
    volumes:
      - hafalanku-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hafalanku_user} -d ${POSTGRES_DB:-hafalanku}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  hafalanku-mongo:
    image: mongo:7
    environment:
      TZ: Asia/Jakarta
    volumes:
      - hafalanku-mongo-data:/data/db
    restart: always

  hafalanku-redis:
    image: redis:7-alpine
    environment:
      TZ: Asia/Jakarta
    volumes:
      - hafalanku-redis-data:/data
    restart: always

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: sh -c "npx prisma db push && node prisma/seed.js && npm run start"
    environment:
      NODE_ENV: production
      TZ: Asia/Jakarta
      DATABASE_URL: ${DATABASE_URL:-postgresql://hafalanku_user:P@ssw0rdHafalanKu2026!@hafalanku-postgres:5432/hafalanku?schema=public}
      MONGODB_URL: ${MONGODB_URL:-mongodb://hafalanku-mongo:27017/hafalanku}
      REDIS_URL: ${REDIS_URL:-redis://hafalanku-redis:6379}
      PORT: ${BACKEND_PORT:-4000}
      BACKEND_PORT: ${BACKEND_PORT:-4000}
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-min-32-chars-here-replace-in-production}
      APP_SECRET: ${APP_SECRET:-your-aes-256-secret-key-min-32-chars-replace-in-production}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-1h}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-123456789:ABCdefGHIjklMNOpqrsTUVwxyz}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:--1001234567890}
      SUPERADMIN_PHONE: ${SUPERADMIN_PHONE:-085229925593}
      WA_GATEWAY_URL: ${WA_GATEWAY_URL:-http://localhost:8000}
      UPLOAD_DIR: ${UPLOAD_DIR:-./uploads}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-2097152}
      FRONTEND_URL: ${FRONTEND_URL:-https://hafalanku.forapp.id}
    expose:
      - "4000"
    volumes:
      - hafalanku-wa-sessions:/app/backend/whatsapp_sessions
      - hafalanku-uploads:/app/backend/uploads
    depends_on:
      hafalanku-postgres:
        condition: service_healthy
      hafalanku-mongo:
        condition: service_started
      hafalanku-redis:
        condition: service_started
    restart: always

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://backend-hafalanku.forapp.id/api/v1}
    environment:
      NODE_ENV: production
      TZ: Asia/Jakarta
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://backend-hafalanku.forapp.id/api/v1}
      PORT: 3000
    expose:
      - "3000"
    depends_on:
      - backend
    restart: always

volumes:
  hafalanku-pg-data:
  hafalanku-mongo-data:
  hafalanku-redis-data:
  hafalanku-wa-sessions:
  hafalanku-uploads:
