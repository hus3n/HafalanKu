services:
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: hafalanku-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: hafalanku-backend
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://hafalanku_user:hafalanku_password@postgres:5432/hafalanku?schema=public
      - MONGODB_URL=mongodb://mongo:27017/hafalanku
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - APP_SECRET=${APP_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - NODE_ENV=production
      - BACKEND_PORT=4000
    depends_on:
      - postgres
      - mongo
      - redis
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: hafalanku-postgres
    volumes:
      - pg_prod_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=hafalanku
      - POSTGRES_USER=hafalanku_user
      - POSTGRES_PASSWORD=${PG_PASSWORD:-hafalanku_password}
    ports:
      - "5432:5432"
    restart: always

  mongo:
    image: mongo:7
    container_name: hafalanku-mongo
    volumes:
      - mongo_prod_data:/data/db
    ports:
      - "27017:27017"
    restart: always

  redis:
    image: redis:7-alpine
    container_name: hafalanku-redis
    volumes:
      - redis_prod_data:/data
    ports:
      - "6379:6379"
    restart: always

  nginx:
    image: nginx:alpine
    container_name: hafalanku-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/ssl/certs:ro
    depends_on:
      - frontend
      - backend
    restart: always

volumes:
  pg_prod_data:
    name: hafalanku_pg_prod_data
  mongo_prod_data:
    name: hafalanku_mongo_prod_data
  redis_prod_data:
    name: hafalanku_redis_prod_data
