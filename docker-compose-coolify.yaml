version: '3.8'

services:
  # ==========================================
  # DATABASE SERVICES
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: hafalanku-postgres
    restart: always
    environment:
      POSTGRES_USER: hafalanku_user
      POSTGRES_PASSWORD: hafalanku_password
      POSTGRES_DB: hafalanku
    volumes:
      - hafalanku_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hafalanku_user -d hafalanku"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:6.0
    container_name: hafalanku-mongo
    restart: always
    volumes:
      - hafalanku_mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0-alpine
    container_name: hafalanku-redis
    restart: always
    volumes:
      - hafalanku_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # APPLICATION SERVICES
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hafalanku-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database Connections (Internal Docker Network)
      DATABASE_URL: "postgresql://hafalanku_user:hafalanku_password@postgres:5432/hafalanku?schema=public"
      MONGODB_URL: "mongodb://mongo:27017/hafalanku"
      REDIS_URL: "redis://redis:6379"
      
      # Auth & Encryption
      JWT_SECRET: "hafalanku-jwt-secret-min-32-chars-local-dev"
      JWT_ACCESS_EXPIRY: "1h"
      JWT_REFRESH_EXPIRY: "7d"
      APP_SECRET: "hafalanku-aes-256-secret-key-local-dev-32chars"
      
      # Telegram Bot (Default from .env)
      TELEGRAM_BOT_TOKEN: "123456789:ABCdefGHIjklMNOpqrsTUVwxyz"
      
      # App Settings
      FRONTEND_URL: "http://localhost:3000" # Update this to your actual Coolify frontend domain later if needed
      BACKEND_PORT: 4000
      NODE_ENV: "production"
      
      # File Upload
      UPLOAD_DIR: "./uploads"
      MAX_FILE_SIZE: 2097152
    volumes:
      - hafalanku_uploads:/app/backend/uploads
    ports:
      - "4000:4000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: hafalanku-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: "http://backend:4000/api/v1" # Internal routing if next.js uses rewrites or if it's SSR. For CSR, use the public domain.
    ports:
      - "3000:3000"

volumes:
  hafalanku_pg_data:
  hafalanku_mongo_data:
  hafalanku_redis_data:
  hafalanku_uploads:
